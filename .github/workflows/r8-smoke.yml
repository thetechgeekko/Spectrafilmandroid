# Manual-dispatch build of the R8-minified release APK for on-device smoke
# testing BEFORE tagging a release. Rationale: `isMinifyEnabled = true` is not
# exercised by the CI `android` job (debug build, minify off), and a wrong R8
# keep-rule fails only as a runtime crash or black export — so the repo
# convention requires an on-device smoke test of a minified build before any
# `v*` tag (CLAUDE.md, docs/AUDIT.md §D, issue #129).
#
# Gradle deliberately emits an unsigned release candidate. This workflow aligns
# that exact R8 output and signs it with the committed, public debug keystore so
# it installs over a debug build. It is a test artifact, never a release.
# Production signing remains exclusive to release.yml's protected Environment.
#
# Added with explicit owner authorization on issue #129 (workflow edits are
# otherwise out of bounds for agents per HANDOFF.md).
name: R8 smoke APK

on:
  workflow_dispatch:

jobs:
  r8-smoke:
    name: Build R8-minified release APK (explicit debug signing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install NDK + CMake + build-tools
        # Same pins as ci.yml: NDK r27 for 16 KB-aligned native LOAD segments,
        # build-tools 35 for zipalign -P 16.
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" "build-tools;35.0.0"

      - name: Assemble release APK (R8 minified)
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
              app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null 2>&1; then
            echo "::error::Gradle unexpectedly signed the smoke candidate"
            exit 1
          fi

      - name: Align and explicitly debug-sign the smoke APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED="$RUNNER_TEMP/Spektrafilm-r8-smoke-aligned.apk"
          SMOKE=app/build/outputs/apk/release/Spektrafilm-r8-smoke.apk
          echo "6e54a211d3fc65cc07d2609a58f0e4af8beadac90b89a99b9f9f0572eb1fb519  debug.keystore" \
            | sha256sum -c -
          "$BT/zipalign" -f -P 16 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SMOKE" \
            "$ALIGNED"
          rm -f "$ALIGNED"
          "$BT/apksigner" verify --verbose "$SMOKE"

      - name: Verify 16 KB page compatibility (Android 15)
        # Same two checks as the ci.yml debug gate, on the RELEASE APK:
        #   1. Every bundled .so sits at a 16 KB-aligned offset in the APK zip.
        #   2. Every 64-bit .so has 16 KB-aligned PT_LOAD segments.
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/Spektrafilm-r8-smoke.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          # zipalign -c exits 0 when every entry is aligned, non-zero otherwise.
          # (Don't grep its stdout — the tool prints "succesful", misspelled.)
          "$BT/zipalign" -c -v -P 16 4 "$APK"
          rm -rf /tmp/apk16 && mkdir -p /tmp/apk16
          unzip -oq "$APK" 'lib/arm64-v8a/*' 'lib/x86_64/*' -d /tmp/apk16
          bad=0
          for so in $(find /tmp/apk16/lib -name '*.so'); do
            a=$(readelf -lW "$so" | awk '/LOAD/{print $NF; exit}')
            if [ "$a" != "0x4000" ]; then echo "NOT 16KB-aligned: ${so#/tmp/apk16/} ($a)"; bad=1; fi
          done
          [ "$bad" = 0 ] && echo "All 64-bit native libs are 16 KB-aligned."
          exit $bad

      - name: Verify the shrunk dex still has the JNI-resolved members
        # THIS IS WHY THIS WORKFLOW EXISTS, and it used to be done only by hand.
        #
        # R8 removed kotlin.Triple.getFirst/getSecond/getThird (and the
        # kotlin.Pair pair) from every release APK this project shipped.
        # proguard-rules.pro kept com.spectrafilm.engine.**, so the engine's own
        # getters survived and returned real Triples -- but NO BYTECODE calls
        # Triple.getFirst. Its only caller is spektra_jni.cpp, by literal string,
        # which R8 cannot see, so it shrank them as unreachable. `-dontobfuscate`
        # does not help: it prevents renaming, not removal.
        #
        # Result: 19 engine params marshalled as 0.0 on every release render --
        # no crash, no log, just wrong numbers. Zero grain particle scale is
        # degenerate, which is why the slide route rendered a flat constant.
        #
        # Nothing that compiles or links can see this: the native build is fine,
        # the Kotlin build is fine, and the host parity suite runs neither R8 nor
        # JNI. The defect exists only in the shrunk dex, so the check reads the
        # dex. The script fails loudly (never silently skips) if dexdump is
        # missing or the class cannot be parsed.
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/Spektrafilm-r8-smoke.apk
          tools/r8_check/check_release_dex.sh "$APK" "$ANDROID_HOME/build-tools/35.0.0"

      - name: Upload R8 smoke APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Spektrafilm-r8-smoke-apk
          path: app/build/outputs/apk/release/Spektrafilm-r8-smoke.apk
          if-no-files-found: error
